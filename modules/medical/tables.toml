[tables.kits]
title = "First aid kits"
columns.name = { type = "text", required = true }
columns.place = { type = "link", to = "stock.places" }
columns.kept = { type = "choice", required = true, choices = [{ key = "home", label = "At home" }, { key = "vehicle", label = "In a car or other vehicle" }, { key = "elsewhere", label = "Somewhere else, such as work" }] }
columns.last_checked = { type = "date" }
columns.next_check = { type = "date" }
columns.notes = { type = "longtext" }

[tables.kits.watch]
expiring = { date = "next_check", warn_days = 30, wording = "due", what = "kit check" }

[[tables.kits.watch.gaps]]
none = { kept = "home" }
message = "No first aid kit is recorded at home. Add one, or check where your kits are kept."

[[tables.kits.watch.gaps]]
missing = "kept"
message = "Is {name} kept at home, in a vehicle or somewhere else?"

[[tables.kits.watch.gaps]]
missing = "place"
message = "Which place is {name} in? Choose where to find it."

[[tables.kits.watch.gaps]]
missing = "next_check"
message = "When do you plan to check {name} again?"

[tables.kit_checks]
title = "Kit checks"
columns.kit = { type = "link", to = "kits", required = true }
columns.checked_on = { type = "date", required = true, default = "today" }
columns.next_check = { type = "date" }
columns.checked_by = { type = "link", to = "people.people" }
columns.notes = { type = "longtext" }

[tables.training]
title = "First aid training"
columns.person = { type = "link", to = "people.people", required = true }
columns.course = { type = "choice", required = true, choices = ["first_aid", "cpr", "other"] }
columns.provider = { type = "text" }
columns.completed_on = { type = "date", required = true }
columns.renew_by = { type = "date" }
columns.notes = { type = "text" }

[tables.training.watch]
expiring = { date = "renew_by", warn_days = 30, wording = "due", what = "training renewal" }
