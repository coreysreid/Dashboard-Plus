# A small, manual wine list (decision 0095). Counts are typed by the household and never change by themselves;
# "Where kept" is free text, not a Stock place; Price paid and Tasting notes are ordinary fields that enter
# spreadsheet exports. Nothing here gives buying, storage, drinking, health or value advice.

[tables.wines]
title = "Wines"
columns.name = { type = "text", required = true }
columns.producer = { type = "text" }
columns.vintage = { type = "integer", min = 1900, max = 2100 }
columns.region = { type = "text" }
columns.grape = { type = "text" }

[tables.bottles]
title = "Bottles"
record_name = "{wine}, {quantity}[ at {place}]"
columns.wine = { type = "link", to = "wines", required = true }
columns.quantity = { type = "integer", required = true, min = 0 }
columns.place = { type = "text" }
columns.bought_on = { type = "date" }
columns.price = { type = "money", min = 0 }

[tables.bottles.watch]
[[tables.bottles.watch.gaps]]
missing = "place"
message = "Where are the bottles of {wine} kept? Write a shelf or rack if it would help you find them."

[tables.tastings]
title = "Tasting notes"
record_name = "{wine}, tasted {tasted_on}"
columns.wine = { type = "link", to = "wines", required = true }
columns.tasted_on = { type = "date", required = true }
columns.notes = { type = "longtext", required = true }
