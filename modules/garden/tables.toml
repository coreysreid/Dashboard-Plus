# Each bed or pot is at one of the household's own Places (Household stock), so "Backyard" means the same
# here as everywhere else (decision 0076). Nothing here gives growing advice: dates and amounts are the
# household's own records, and the only reminder uses the date a household types for a job.

[tables.beds]
title = "Garden beds"
description = "Each bed, pot or growing spot and where it is."
columns.name = { type = "text", required = true }
columns.place = { type = "link", to = "stock.places", on_delete = "restrict" }
columns.notes = { type = "longtext" }

[tables.beds.watch]
[[tables.beds.watch.gaps]]
missing = "place"
message = "Where is {name}? Choose one of your places."

[tables.crops]
title = "Crops"
columns.name = { type = "text", required = true }
columns.variety = { type = "text" }
columns.notes = { type = "longtext" }

[tables.plantings]
title = "Plantings"
columns.name = { type = "text", required = true }
columns.bed = { type = "link", to = "beds", required = true }
columns.crop = { type = "link", to = "crops", required = true }
columns.planted_on = { type = "date", required = true }
columns.quantity = { type = "integer", min = 1 }
columns.notes = { type = "longtext" }

[tables.harvests]
title = "Harvests"
record_name = "{planting}, picked {harvested_on}"
columns.planting = { type = "link", to = "plantings", required = true }
columns.harvested_on = { type = "date", required = true }
columns.amount = { type = "decimal", min = 0 }
columns.unit = { type = "choice", choices = ["kg", "items", "bunches"] }
columns.notes = { type = "longtext" }

[tables.jobs]
title = "Garden jobs"
columns.title = { type = "text", required = true }
columns.bed = { type = "link", to = "beds" }
columns.due_on = { type = "date" }
columns.done = { type = "boolean", default = false }
columns.notes = { type = "longtext" }

[tables.jobs.watch]
# A finished job is never reminded about (decision 0072): the reminder uses only the household's own due date.
expiring = { date = "due_on", warn_days = 14, wording = "due", what = "job", where = { done = false } }
