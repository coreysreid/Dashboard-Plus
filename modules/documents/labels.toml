[tables.documents]
home = "main"
empty = "Add where one important paper is kept."
form = ["name", "kind", "holder", "place", "renew_by", "copies", "notes"]
list = ["name", "kind", "holder", "place", "renew_by"]
columns.name = { label = "Document", help = "Use a name you recognise, such as Home insurance policy or Family passports. A name is enough; keep the document number with the paper." }
columns.kind = { label = "Kind of document" }
columns.holder = { label = "Whose document", help = "Choose one of your People if it helps find the right paper. Leave blank for papers that belong to the whole household." }
columns.place = { label = "Where it is kept", help = "Choose one of your Places, such as Study or Hall cupboard. Places are shared with Household stock." }
columns.renew_by = { label = "Review or renew by", help = "A date shown on the document, or one you choose as a reminder. The dashboard will remind you a month before. Leave blank if none applies." }
columns.copies = { label = "Copies also kept at", help = "Where copies of this paper are kept, such as a hard drive or a family cloud folder. Dashboard Plus never stores the document itself." }
columns.notes = { help = "Use Notes for anything else that helps you find or review this paper. Choose where copies are kept in ‘Copies also kept at’ above. Keep scans, numbers and passwords in a place you trust." }

[tables.copy_places]
home = "more"
empty = "Add a place where copies of papers are kept, such as a hard drive or a family cloud folder."
form = ["name"]
list = ["name"]
columns.name = { label = "Place copies are kept", help = "For example Blue USB drive, Family cloud folder or Solicitor. A name only: never a password or a link." }
