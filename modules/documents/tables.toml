# A list of where papers are kept, not a document vault (decision 0062). There is no field for a
# document number, password or copy of the paper. Whose document it is links to People, and where it is
# kept links to the household's own Places, shared with Household stock. No renewal interval is assumed:
# the date is one the household types from the document itself or chooses as a reminder.

[tables.documents]
title = "Important documents"
description = "Where to find important papers and their copies, and when to look at them again. Keep the papers, scans and numbers in a place you trust."
columns.name = { type = "text", required = true }
columns.kind = { type = "choice", required = true, choices = [
    { key = "passport", label = "Passport" },
    { key = "identity", label = "Birth certificate, licence or other identity paper" },
    { key = "insurance", label = "Insurance policy" },
    { key = "will", label = "Will or power of attorney" },
    { key = "property", label = "Deed, lease or tenancy agreement" },
    { key = "warranty", label = "Warranty or receipt" },
    { key = "other", label = "Other" },
] }
columns.holder = { type = "link", to = "people.people", on_delete = "clear" }
columns.place = { type = "link", to = "stock.places", on_delete = "restrict" }
columns.renew_by = { type = "date" }
columns.copies = { type = "links", to = "copy_places" }
columns.notes = { type = "longtext" }

# Only the names of the places copies are kept, such as a hard drive or a family cloud folder (decision 0090).
# Never the copy itself, a scan or a document number.
[tables.copy_places]
title = "Places copies are kept"
description = "Where copies of important papers are kept, such as a hard drive, a family cloud folder or a solicitor."
columns.name = { type = "text", required = true }

[tables.documents.watch]
expiring = { date = "renew_by", warn_days = 30, wording = "due", what = "review or renewal" }

# Asked for each paper written down, never "do you have a will?": that depends on the household.
[[tables.documents.watch.gaps]]
missing = "place"
message = "Where is {name} kept? Choosing one of your places is enough."

# A month calendar of each paper's own review or renewal date (decision 0125), shown once. Nothing says a paper was
# renewed. Only the paper's name and the date show; its kind, holder, place and notes never do.
[tables.documents.calendar]
title = "Documents calendar"
entry = ["renewal", "renewals"]
due = true
