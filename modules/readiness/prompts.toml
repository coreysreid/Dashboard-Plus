# "Have you thought about…?" questions (decision 0104), from Lane B's draft (workbench/drafts/readiness,
# now in git history). Each asks a household to think; none says the household is safe or gives emergency
# instructions. Every question links the official page it was written from and the date that page was
# checked. `review_every` is an editorial reminder in months, not an authority's deadline.
#
# fits: only the household's own Settings answers, never a guess from an address or a country.
#   storeys_min = 2       the home has at least this many storeys (still asked when storeys are not given)
#   hazards = ["flood"]   the household ticked it under "Things that can happen where you live"
#   pets = true           the household has pets; mobility_needs = true: someone has mobility or care needs
# answered_by: the field that may help, or "none". It is only offered as "You already recorded this. Does it
# answer the question?" when `match` holds exactly, and a person always chooses the answer.
#
# Schema 2 (decision 0108) adds "Think it through" drills at the end of this file: [[scenario]] lists its
# steps in order, by id. A step is a [[prompt]] above (shared: answering it in a drill also counts on the
# Questions page) or a drill-only [[step]] (never listed as a question). `missing` is the exact sentence
# shown when nothing is recorded; `caution` is shown with any record offered. Practice runs are kept in
# `runs`, and each step's choice and the person's own words (private, never travelling) in `run_steps`.
#
# Schema 3 (decision 0113): every `match` also says `ask_again`, the fields of the record a person chose whose
# change brings a confirmed Yes back. `fields` are compared by value; a place also covers every place around it
# (their names and what each sits inside, never their notes). `states` count only whether a field still meets
# the match: water used from a batch that still has some left, or "litre" for "litres", asks nothing. Any other
# edit (a kit's last-checked date, a note, a phone's email) leaves the answer alone; its look-again date stays.
schema = 3
answers = "answers"
runs = "drill_runs"
run_steps = "drill_steps"

[[group]]
key = "fire"
title = "Fire"

[[group]]
key = "flood"
title = "Flood"

[[group]]
key = "storm"
title = "Storm"

[[group]]
key = "heat"
title = "Heat"

[[group]]
key = "power"
title = "Power cuts"

[[group]]
key = "medical"
title = "Medical needs"

[[group]]
key = "leaving"
title = "Leaving home quickly"

