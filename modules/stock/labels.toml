[tables.places]
form = ["name", "notes"]
list = ["name", "notes"]

[tables.items]
columns.name = { help = "Start typing to pick from common goods, or type your own.", suggest_from = "catalogue.csv", fills = { category = "category", unit = "unit", drinking = "counts_as_drinking_water" } }
empty = "Add a few things from the pantry."
form = ["name", "category", "drinking", "quantity", "unit", "minimum", "place", "expires", "notes"]
list = ["name", "category", "quantity", "unit", "minimum", "place", "expires"]
columns.quantity = { label = "Amount on hand", help = "For water, enter the total number of litres, not the number of bottles." }
columns.drinking = { label = "Safe to drink", help = "Untick for water kept for washing or flushing, or distilled water for appliances. Only drinking water counts towards days of water.", show_when = { category = "water" } }
columns.unit = { label = "Unit", help = "Use litres for water; for other things, a unit such as tins, kg or packs." }
columns.minimum = { label = "Keep at least", help = "You'll see it under Needs attention when it drops below this." }
columns.expires = { label = "Use by" }

[tables.movements]
form = ["item", "reason", "amount", "happened_on", "notes"]
list = ["happened_on", "item", "reason", "amount", "notes"]
columns.amount = { label = "How many", help = "In the item's own unit. The item's count changes by this much." }
columns.happened_on = { label = "Date" }
