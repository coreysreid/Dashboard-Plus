[[sheet]]
name = "supplies"
title = "Emergency supplies"
intro = "Drinking water, first aid, power and pantry food recorded here, batch by batch, and where each is kept. Water not safe to drink and other kinds of stock are not shown. Check use-by dates and amounts when you print a new copy."

[[sheet.section]]
title = "Drinking water (litres)"
table = "lots"
where = { "item.category" = "water", "item.drinking" = true }
columns = ["item", "quantity", "place", "expires"]
order_by = "expires"

[[sheet.section]]
title = "First aid and medical"
table = "lots"
where = { "item.category" = "first_aid" }
columns = ["item", "quantity", "item.unit", "place", "expires"]
order_by = "expires"

[[sheet.section]]
title = "Batteries, torches and power"
table = "lots"
where = { "item.category" = "power" }
columns = ["item", "quantity", "item.unit", "place"]
order_by = "expires"

[[sheet.section]]
title = "Food"
table = "lots"
where = { "item.category" = "pantry" }
columns = ["item", "quantity", "item.unit", "place", "expires"]
order_by = "expires"
