[[sheet]]
name = "supplies"
title = "Emergency supplies"
intro = "Water, first aid, power and pantry food recorded here, and where they are kept. Other kinds of stock are not shown. Check use-by dates and amounts when you print a new copy."

[[sheet.section]]
title = "Water (litres)"
table = "items"
where = { category = "water" }
columns = ["name", "quantity", "place", "expires"]
order_by = "expires"

[[sheet.section]]
title = "First aid and medical"
table = "items"
where = { category = "first_aid" }
columns = ["name", "quantity", "unit", "place", "expires"]
order_by = "name"

[[sheet.section]]
title = "Batteries, torches and power"
table = "items"
where = { category = "power" }
columns = ["name", "quantity", "unit", "place"]
order_by = "name"

[[sheet.section]]
title = "Food"
table = "items"
where = { category = "pantry" }
columns = ["name", "quantity", "unit", "place", "expires"]
order_by = "name"
