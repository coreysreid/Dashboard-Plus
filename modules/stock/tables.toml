[tables.places]
title = "Places"
description = "Where things are kept: a room, a cupboard in it, a shelf in that (Kitchen › Pantry › Shelf 3)."
parent = "inside"
columns.name = { type = "text", required = true }
columns.inside = { type = "link", to = "places", on_delete = "restrict" }
columns.notes = { type = "text" }
# For the way-out sketch (decision 0118), rooms and areas only: the floor it is on (or left off the sketch),
# whether someone sleeps there, and a possible window exit the household added after checking it locally.
columns.floor = { type = "choice", choices = [
  { key = "below", label = "Below street level" },
  { key = "street", label = "Street level" },
  { key = "up1", label = "One floor up" },
  { key = "up2", label = "Two floors up" },
  { key = "up3", label = "Three or more floors up" },
  { key = "off", label = "Leave off the sketch" },
] }
columns.sleeping = { type = "boolean" }
columns.window_exit = { type = "boolean" }

[tables.items]
title = "Stock items"
description = "Everything worth keeping track of, with how many you have and how many to keep."
columns.name = { type = "text", required = true }
columns.category = { type = "choice", required = true, default = "pantry", choices = [
  "pantry",
  "water",
  { key = "first_aid", label = "First aid and medical" },
  "toiletries",
  "cleaning",
  { key = "power", label = "Batteries, torches and power" },
  "fuel",
  "tools",
  { key = "hardware", label = "Screws, fixings and hardware" },
  { key = "pet", label = "Pet supplies" },
  "garden",
  "other",
] }
columns.quantity = { type = "decimal", min = 0 }
columns.drinking = { type = "boolean", required_when = { category = "water" } }
columns.unit = { type = "text" }
columns.minimum = { type = "decimal", min = 0 }
columns.place = { type = "link", to = "places", on_delete = "restrict" }
columns.expires = { type = "date" }
columns.notes = { type = "longtext" }

[tables.items.watch]
# "How many" and "Use by" on an item are worked out from its batches (see tables.lots.total).
# Use-by warnings come from each batch, so 3 tins next month and 10 in six months are told apart.
running_low = { quantity = "quantity", minimum = "minimum" }
# Water: a commonly used starting figure is about 3 litres per person per day.
# The page always says local advice comes first.
supply = { quantity = "quantity", per_person_per_day = 3, per_pet_per_day = 1, target_days = 3, unit = "litres", label = "drinking water", where = { category = "water" }, counts_only = { drinking = true }, unit_from = "unit", unit_words = ["l", "litre", "liter", "liters"] }

[tables.lots]
title = "Batches"
description = "Part of an item's stock with its own amount, use-by date and place: 3 tins at Kitchen › Pantry › Shelf 3, use by 20/05/27. The item's amount is the sum of its batches."
record_name = "{item}, {quantity}[ {item.unit}][ at {place}][, use by {expires}]"
columns.item = { type = "link", to = "items", required = true, on_delete = "cascade" }
columns.quantity = { type = "decimal", required = true, min = 0 }
columns.expires = { type = "date" }
columns.place = { type = "link", to = "places", on_delete = "restrict" }
columns.notes = { type = "text" }

[tables.lots.total]
# The item's amount is the sum of its batches, and its "Use by" the earliest date of a batch
# that still holds something. An item added with an amount, place and use-by starts its first batch.
link = "item"
amount = "quantity"
into = "quantity"
earliest = { date = "expires", into = "expires" }
starts_from = ["quantity", "place", "expires"]

[tables.lots.watch]
expiring = { date = "expires", warn_days = 30, only_positive = "quantity" }

[tables.movements]
title = "Stock in and out"
description = "Each time something is bought, used, expires or is thrown away, and each stocktake correction. The item's count updates by itself."
columns.item = { type = "link", to = "items", required = true, on_delete = "cascade" }
columns.reason = { type = "choice", required = true, default = "bought", choices = [
  { key = "bought", label = "Bought or added" },
  "used",
  "expired",
  { key = "thrown_away", label = "Thrown away" },
  { key = "given_away", label = "Given away" },
  { key = "counted_more", label = "Stocktake: more than recorded" },
  { key = "counted_less", label = "Stocktake: fewer than recorded" },
] }
columns.amount = { type = "decimal", required = true, min = 0 }
columns.happened_on = { type = "date", required = true, default = "today" }
columns.notes = { type = "text" }
columns.lot = { type = "link", to = "lots", on_delete = "clear" }
columns.expires = { type = "date" }
columns.place = { type = "link", to = "places", on_delete = "clear" }

[tables.movements.adjusts]
# Each movement changes one batch, and so the item's amount: "bought" (and counting more) adds, the others take away.
# With no batch chosen, stock in starts a new batch (with its use-by date and place), and using some
# takes from the batch with the earliest known use-by date.
link = "lot"
quantity = "quantity"
amount = "amount"
direction = "reason"
adds = ["bought", "counted_more"]
belongs_to = "item"
new_batch = { expires = "expires", place = "place" }
oldest_first = "expires"
# "Count this batch" on a batch saves the difference between the count and what was recorded as one
# stocktake correction: counted_more adds it, counted_less takes it away. Never the count on top of
# the amount, never a purchase or waste. It needs a chosen batch (decision 0070).
counts = { more = "counted_more", less = "counted_less", note = "notes" }

[tables.connections]
title = "Connections between places"
description = "Which rooms and areas lead into which, and how: Hallway to Kitchen through a door, Hallway to outside through the front door."
record_name = "{place}[ to {connects_to}]: {kind}"
columns.place = { type = "link", to = "places", required = true, on_delete = "cascade" }
columns.connects_to = { type = "link", to = "places", on_delete = "cascade" }
columns.kind = { type = "choice", required = true, default = "door", choices = [
  "door",
  { key = "opening", label = "Open doorway or archway" },
  "stairs",
  { key = "outside_door", label = "Door to outside" },
  "other",
] }
columns.notes = { type = "text" }
# For the way-out sketch (decision 0118): where a door to outside really leads, as the household confirmed it.
columns.destination = { type = "choice", choices = [
  "outside",
  { key = "shared", label = "Shared building area" },
  { key = "check", label = "Needs checking" },
] }
# A place is never joined to itself, and two places are joined once, either way round (decision 0103).
# "Connects to" may be left blank only for a door straight outside.
pair = { columns = ["place", "connects_to"], blank_when = { kind = "outside_door" } }
