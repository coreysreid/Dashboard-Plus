[[sheet]]
name = "emergency"
title = "Emergency sheet (fridge copy)"
intro = "Keep a printed copy on the fridge. In an emergency, call your local emergency number first."

[[sheet.section]]
title = "Who lives here"
table = "people"
where = { lives_here = true }
columns = ["name", "phone", "other_phone"]
order_by = "name"

[[sheet.section]]
title = "Who to call"
table = "roles"
columns = ["priority", "role", "person", "person.phone"]
order_by = "priority"

[[sheet]]
name = "emergency_medical"
title = "Emergency sheet with private medical details"
intro = "Contains private health and care details. Print only when needed and keep it out of public view. For emergency responders and carers."

[[sheet.section]]
title = "Who lives here"
table = "people"
where = { lives_here = true }
columns = ["name", "phone", "other_phone"]
order_by = "name"

[[sheet.section]]
title = "Who to call"
table = "roles"
columns = ["priority", "role", "person", "person.phone"]
order_by = "priority"

[[sheet.section]]
title = "Important details"
table = "important_info"
columns = ["person", "kind", "detail"]
order_by = "person"
