[tables.exits]
empty = "Write down the ways out of your home."
form = ["name", "floor", "place", "route", "notes"]
list = ["name", "floor", "place", "route"]
columns.name = { help = "For example, Front door or Back door." }
columns.floor = { label = "Floor", help = "For example, Ground floor. Leave blank if your home has one floor." }
columns.place = { label = "Where it is", help = "Choose one of your Places, or add the room first. Places are shared with Household stock." }
columns.route = { label = "How to get there", help = "In your own words, including the way from upstairs if you have one. Keep it current if the layout changes." }
columns.notes = { help = "Do not write down where a spare key is hidden or an alarm code." }

[tables.shutoffs]
empty = "Write down where the water shut-off and power board are."
form = ["name", "kind", "place", "how_to_find", "notes"]
list = ["name", "kind", "place", "how_to_find"]
columns.name = { help = "For example, Water main or Power board." }
columns.kind = { label = "What it turns off" }
columns.place = { label = "Where it is", help = "Choose one of your Places, or add the room or area first. Places are shared with Household stock." }
columns.how_to_find = { label = "How to find it", help = "A landmark helps someone who has never looked for it, such as: behind the grey shelves." }

[tables.equipment]
empty = "Add a smoke alarm and where it is."
form = ["name", "kind", "place", "last_tested", "battery_changed", "next_check", "notes"]
list = ["name", "kind", "place", "last_tested", "next_check"]
columns.name = { help = "For example, Upstairs hall smoke alarm. First aid kits have their own list." }
columns.kind = { label = "What it is" }
columns.place = { label = "Where it is", help = "Choose one of your Places, or add the room first. Places are shared with Household stock." }
columns.last_tested = { label = "Last tested or checked" }
columns.battery_changed = { label = "Battery changed", help = "Only if it has a battery you can change." }
columns.next_check = { label = "Test or check again by", help = "Choose a date from the maker's instructions, your local fire service's advice or your own plan. The dashboard will remind you a month before." }

[tables.meters]
empty = "Add a meter if it helps someone find it."
form = ["name", "kind", "place", "how_to_find"]
list = ["name", "kind", "place", "how_to_find"]
columns.name = { help = "For example, Electricity meter." }
columns.kind = { label = "What it measures" }
columns.place = { label = "Where it is", help = "Choose one of your Places, or add the room or area first. Places are shared with Household stock." }
columns.how_to_find = { label = "How to find it", help = "A short landmark is enough. Do not enter account numbers or access codes." }
