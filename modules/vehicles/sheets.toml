[[sheet]]
name = "vehicles"
title = "Vehicles"
intro = "Each vehicle, who to call if it breaks down and their phone number from People, and the dates you chose to be reminded of. Registration and policy numbers are not printed. Check dates against your own notices before relying on this page."

[[sheet.section]]
title = "Vehicles"
table = "vehicles"
columns = ["name", "roadside_contact", "roadside_contact.phone", "parked_at", "emergency_kit", "registration_due"]
order_by = "name"

[[sheet.section]]
title = "Insurance renewals"
table = "insurance"
columns = ["vehicle", "name", "renew_by"]
order_by = "renew_by"

[[sheet.section]]
title = "Services and checks"
table = "services"
columns = ["vehicle", "name", "last_done", "next_due"]
order_by = "next_due"
