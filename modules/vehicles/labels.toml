[tables.vehicles]
empty = "Add a vehicle and who you would call if it broke down."
form = ["name", "registration", "registration_due", "roadside_contact", "parked_at", "emergency_kit", "notes"]
list = ["name", "registration_due", "roadside_contact", "parked_at", "emergency_kit"]
columns.name = { label = "Vehicle", help = "Use a name your household recognises, such as Family car." }
columns.registration = { label = "Registration or plate number", help = "Private: hidden on lists and never printed. Leave blank if you would rather keep it with the vehicle's papers." }
columns.registration_due = { label = "Registration or vehicle tax due", help = "The date on your own renewal notice. The dashboard will remind you a month before. Leave blank if there is nothing to renew." }
columns.roadside_contact = { label = "Who to call if it breaks down", help = "Choose one of your People, or add the roadside service, garage or person first. Their number is kept in People, so it only needs changing in one place." }
columns.parked_at = { label = "Where it is usually kept", help = "Choose one of your Places, such as Car or Garage. Places are shared with Household stock." }
columns.emergency_kit = { label = "Car emergency kit", help = "If you keep one, add it as a Household stock item first (for example jump leads, a torch and a warning triangle), then choose it here. A first aid kit kept in the vehicle belongs in First aid kits." }
columns.notes = { help = "For example, where the vehicle's papers are kept. Do not write down policy or account numbers, or where a spare key is hidden." }

[tables.insurance]
empty = "Add an insurance renewal date if you want a reminder."
form = ["vehicle", "name", "renew_by", "notes"]
list = ["vehicle", "name", "renew_by"]
columns.name = { label = "Insurer or kind of cover", help = "A name you recognise. Keep the policy and its number with your own papers." }
columns.renew_by = { label = "Renew by", help = "The date on your own policy or renewal notice. The dashboard will remind you a month before." }
columns.notes = { help = "Do not write down policy numbers here." }

[tables.services]
empty = "Add a service or check from your vehicle's own schedule."
form = ["vehicle", "name", "last_done", "next_due", "notes"]
list = ["vehicle", "name", "last_done", "next_due"]
columns.name = { label = "Service or check", help = "For example, Routine service or Roadworthy inspection." }
columns.last_done = { label = "Last done" }
columns.next_due = { label = "Next due", help = "Choose a date from your vehicle's service book, your mechanic or your own plan. Nothing is worked out from the last one. This is a reminder, not a safety check." }
