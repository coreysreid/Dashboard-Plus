# One commitment row is a reminder, not a payment ledger, policy document or automatic renewal schedule
# (decision 0117). Every date is typed by the household from its own bill or renewal notice; nothing is worked out
# from how often, and nothing here says a bill was paid or a policy is active.
[tables.commitments]
title = "Bills and policies"
description = "A bill or insurance policy, the date to check it, and who provides it."
columns.name = { type = "text", required = true }
columns.kind = { type = "choice", required = true, choices = ["bill", "policy"] }
columns.category = { type = "choice", required = true, choices = ["electricity", "gas", "water", "internet", "phone", "vehicle", "home", "contents", "health", "pet", "other"] }
columns.provider = { type = "link", to = "people.people", on_delete = "clear" }
# Private and kept on the computer where they were typed (decision 0100): never listed, printed, exported,
# shown to a helper or written to the change log.
columns.amount = { type = "money", min = 0, sensitive = true, travels = "never" }
columns.frequency = { type = "choice", choices = ["weekly", "monthly", "quarterly", "yearly", "other"] }
columns.next_due = { type = "date" }
columns.covers = { type = "longtext", sensitive = true, travels = "never" }
# Optional links (decision 0115): Vehicles and Household stock may be off; the link is then kept by its ID.
columns.vehicle = { type = "link", to = "vehicles.vehicles", on_delete = "clear" }
columns.place = { type = "link", to = "stock.places", on_delete = "clear" }
columns.reference = { type = "text", sensitive = true, travels = "never" }
columns.notes = { type = "longtext", sensitive = true, travels = "never" }

[tables.commitments.watch.expiring]
date = "next_due"
warn_days = 30
wording = "due"
what = "bill or policy check"

# "Due" means check the date the household entered, never that insurance is still in force.
[[tables.commitments.watch.expiring.what_when]]
where = { kind = "policy", category = "vehicle" }
what = "vehicle insurance review or renewal"

[[tables.commitments.watch.expiring.what_when]]
where = { kind = "bill" }
what = "bill check"

[[tables.commitments.watch.expiring.what_when]]
where = { kind = "policy" }
what = "policy check"

# One reminder per policy (decision 0117): a Vehicle insurance renewal already in Vehicles keeps reminding there
# until the household chooses, row by row, to move it here. Only the vehicle, the broad name and the date are
# copied; Vehicles notes never are.
[tables.commitments.takes_over]
from = "vehicles.insurance"
where = { kind = "policy", category = "vehicle" }
copy = { vehicle = "vehicle", name = "name", next_due = "renew_by" }
