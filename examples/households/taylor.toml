# A made-up household for demos, screenshots and testing. Every name, number
# and address here is invented. Phone numbers use ranges set aside for drama in
# the United Kingdom (07700 900xxx, 020 7946 0xxx, 0161 496 0xxx); emails use
# example.com.
#
# How to read this file: see examples/households/INDEX.md.

title = "Sam Taylor"
summary = "One person in a second-floor flat in England, just getting started. A few things recorded, and a couple of useful gaps still to fill in."

[setup]
people = ["Sam Taylor"]
pets = 0
country = "United Kingdom"
region = "North West England"
home_type = "apartment"
storeys = 1
mobility_needs = false
hazards = ["flood", "snow", "storm"]
modules = ["people", "stock"]

