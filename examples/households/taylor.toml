# and address here is invented. Phone numbers use ranges set aside for drama in
# the United Kingdom (07700 900xxx, 020 7946 0xxx, 0161 496 0xxx); emails use
# example.com.
#
# How to read this file: see examples/households/INDEX.md.

title = "Sam Taylor"
summary = "One person in a second-floor flat in England, just getting started. A few things recorded, and several useful details still to fill in, such as where the water shut-off is."

