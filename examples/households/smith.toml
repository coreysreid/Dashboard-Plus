country = "Australia"
region = "New South Wales"
home_type = "house"
storeys = 2
mobility_needs = false
hazards = ["bushfire", "heat", "storm"]
modules = ["documents", "garden", "home_care", "home_layout", "lent_out", "medical", "people", "pets", "readiness", "routines", "stock", "utilities", "vehicles", "wine"]

