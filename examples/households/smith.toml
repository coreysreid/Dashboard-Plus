# A made-up household for demos, screenshots and testing. Every name, number
# and address here is invented. Phone numbers use ranges set aside for fiction
# (Australia: 0491 570 xxx and (02) 5550 xxxx); emails use example.com.
#
# How to read this file: see examples/households/INDEX.md.

title = "The Smith family"
summary = "Two parents, two young children, a dog and a cat in a two-storey house in Australia. Well organised, with one gap left to fill."

[setup]
people = ["John Smith", "Jane Smith", "Emily Smith", "Jack Smith"]
