# A made-up household for demos, screenshots and testing. Every name, number
# and address here is invented. Phone numbers use the 555-01xx range set aside
# for fiction in the United States; emails use example.com and example.org.
#
# How to read this file: see examples/households/INDEX.md.

title = "The Garcia household"
summary = "Three generations and a cat in a third-floor apartment in California, getting ready for earthquakes. Grandmother Rosa has care needs and daily medication."

[setup]
people = ["Maria Garcia", "Carlos Garcia", "Sofia Garcia", "Rosa Garcia"]
pets = 1
country = "United States"
region = "California"
home_type = "apartment"
storeys = 1
mobility_needs = true
hazards = ["earthquake", "heat", "power"]
modules = ["people", "stock"]

