[tables.loans]
title = "Things lent out"
description = "One loan at a time, with the borrower, due date and return history."
columns.name = { type = "text", required = true }
columns.stock_item = { type = "link", to = "stock.items", on_delete = "clear" }
columns.borrower = { type = "link", to = "people.people", required = true, on_delete = "restrict" }
columns.lent_on = { type = "date", required = true, default = "today" }
columns.due_back = { type = "date", required = true }
columns.status = { type = "choice", required = true, default = "out", choices = ["out", "returned"] }
columns.returned_on = { type = "date" }
columns.notes = { type = "longtext" }

[tables.loans.watch]
[[tables.loans.watch.gaps]]
missing = "borrower.phone"
where = { status = "out" }
message = "How would you reach {borrower} about {name}? Add a phone number if you have one."
