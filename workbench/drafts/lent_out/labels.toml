[tables.loans]
empty = "Add a tool or other thing when you lend it to someone."
form = ["name", "stock_item", "borrower", "lent_on", "due_back", "status", "returned_on", "notes"]
list = ["name", "borrower", "lent_on", "due_back", "status", "returned_on"]
columns.name = { label = "What you lent", help = "Use a name you and the borrower would recognise." }
columns.stock_item = { label = "Stock item, if tracked", help = "Optional. Linking it helps find the record; this loan does not change its Stock count." }
columns.borrower = { label = "Who borrowed it", help = "Choose a contact in People; add them there first if needed." }
columns.lent_on = { label = "Lent on" }
columns.due_back = { label = "Due back", help = "Agree a date with the borrower. This is your reminder, not an automatic message to them." }
columns.status = { label = "Is it back?" }
columns.returned_on = { label = "Returned on", help = "Fill this when it comes back. Set Is it back? to Returned too." }
columns.notes = { help = "For example, an accessory or condition to check on return. Do not put private contact details here." }
