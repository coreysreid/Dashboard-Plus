[tables.services]
empty = "Add one household service and who to contact about a fault."
form = ["name", "kind", "provider", "fault_contact", "account_number", "meter", "notes"]
list = ["name", "kind", "provider", "fault_contact", "meter"]
columns.name = { label = "Service name", help = "For example, Home electricity or Apartment water." }
columns.kind = { label = "Service" }
columns.provider = { label = "Provider", help = "Add the provider as a People contact, then choose it here." }
columns.fault_contact = { label = "Outage or fault line", help = "Keep its current phone number in People so it can be updated once." }
columns.account_number = { label = "Account number", help = "Optional and private. Hidden from lists and print sheets; check the provider's own bill when needed." }
columns.meter = { label = "Meter in Our home", help = "Use the meter name recorded in Home layout. Leave blank for a service without a household meter." }
columns.notes = { help = "Private household notes. Avoid passwords, login codes and payment card details." }
