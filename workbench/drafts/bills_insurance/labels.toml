[tables.commitments]
empty = "Add a bill or policy and the next date you want to check it."
form = ["name", "kind", "category", "provider", "amount", "frequency", "next_due", "covers", "vehicle", "place", "reference", "notes"]
list = ["name", "kind", "category", "provider", "frequency", "next_due", "vehicle", "place"]
columns.name = { label = "Name", help = "Use a broad name you recognise, such as Home electricity or Car insurance. This name can appear in reminders and exports; leave account and policy numbers out." }
columns.kind = { label = "Bill or policy" }
columns.category = { label = "What it is for" }
columns.provider = { label = "Provider", help = "Choose a People contact. Keep its current phone number in People." }
columns.amount = { label = "Amount last quoted or billed", help = "Optional and private on this computer. Enter the amount and currency from your own bill or policy; this is not an amount due calculated by Dashboard." }
columns.frequency = { label = "How often", help = "For your reference only. This does not work out another date or create a payment." }
columns.next_due = { label = "Check or pay by", help = "Type the date from your own bill, renewal notice or household plan. Dashboard reminds you 30 days before; it does not check whether a payment was made or cover is active." }
columns.covers = { label = "What it covers", help = "Optional and private on this computer. Keep this a short summary; check the policy itself for exclusions, limits and current cover." }
columns.vehicle = { label = "Vehicle, if any", help = "Choose an existing vehicle. Leave blank for a household bill or non-vehicle policy." }
columns.place = { label = "Place, if any", help = "Choose an existing Place. Leave blank if the commitment applies to the whole household." }
columns.reference = { label = "Account or policy reference", help = "Optional and private on this computer. Do not enter a password or payment card number." }
columns.notes = { label = "Private notes", help = "Optional and private on this computer. Do not enter passwords, codes or card details." }
