[tables.documents]
empty = "Add where one important paper is kept."
form = ["name", "kind", "holder", "place", "renew_by", "notes"]
list = ["name", "kind", "holder", "place", "renew_by"]
columns.holder = { label = "Whose document", help = "Use a name if it helps you find the right paper; leave blank for household documents." }
