# An event records food offered, not a claim that the animal ate it.
[tables.servings]
title = "Food given"
description = "Each time food is placed in a bowl or given as a treat."
record_name = "{pet}: {food}"
columns.pet = { type = "link", to = "pets.pets", required = true, on_delete = "restrict" }
columns.given_at = { type = "datetime", required = true }
columns.kind = { type = "choice", required = true, choices = ["bowl", "refill", "treat"] }
columns.bowl = { type = "text" }
columns.food = { type = "text", required = true }
columns.amount = { type = "decimal", min = 0.01 }
columns.unit = { type = "choice", choices = ["g", "ml", "pouch", "scoop", "piece"] }
columns.notes = { type = "text" }
