[tables.jobs]
title = "Home care jobs"
description = "Checks and upkeep around the home, with the last and next date."
columns.name = { type = "text", required = true }
columns.kind = { type = "choice", required = true, choices = ["gutters", "water_heater", "other"] }
columns.place = { type = "link", to = "stock.places", on_delete = "restrict" }
columns.last_done = { type = "date" }
columns.next_due = { type = "date" }
columns.notes = { type = "longtext", sensitive = true }

[tables.jobs.watch]
expiring = { date = "next_due", warn_days = 30, wording = "due", what = "home care" }

[[tables.jobs.watch.gaps]]
missing = "place"
message = "Where is {name} done? Add a place so the job can be found."

[tables.work_done]
title = "Work done"
description = "A dated note of what was checked or done."
columns.job = { type = "link", to = "jobs", required = true, on_delete = "cascade" }
columns.done_on = { type = "date", required = true, default = "today" }
columns.done_by = { type = "text", sensitive = true }
columns.notes = { type = "longtext", sensitive = true }
