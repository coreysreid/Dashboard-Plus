[tables.jobs]
empty = "Add one home check you want to remember."
form = ["name", "kind", "place", "last_done", "next_due", "notes"]
list = ["name", "kind", "place", "last_done", "next_due"]
columns.name = { help = "Use a broad job name; names appear in lists, questions and the print sheet. Keep private details and codes out." }
columns.place = { label = "Where it is", help = "Choose a shared Place and check its full path." }
columns.last_done = { label = "Last done", help = "After you log Work done, update this date on the job too." }
columns.next_due = { label = "Next due", help = "Type the next date you choose from a manual, provider or your own plan. A Work done note does not change this date." }
columns.notes = { help = "Private until Show. Keep access codes and account details out; follow local safety advice for the work itself." }

[tables.work_done]
empty = "No work logged yet. Add a dated note after a job is done."
form = ["job", "done_on", "done_by", "notes"]
list = ["done_on", "job"]
columns.done_on = { label = "Done on" }
columns.done_by = { label = "Who did it", help = "Private until you choose Show." }
columns.notes = { label = "What was done", help = "Private until Show. Log this work, then open the job to enter Last done and the next date you choose." }
