{% extends "base.html" %}
{% block title %}{{ sheet.title }} · Dashboard Plus{% endblock %}
{% block body %}
<p class="muted"><a href="/">Home</a></p>
<h1>{{ sheet.title }}</h1>
<div class="card">
  <p>This sheet includes private health and care details. Show it only when you mean to print or share it.</p>
  <div class="actions">
    <form method="post" action="/sheet/{{ module }}/{{ name }}">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <button class="button" type="submit">Show private sheet</button>
    </form>
    <a class="button quiet" href="/">Back to Home</a>
  </div>
</div>
{% endblock %}
