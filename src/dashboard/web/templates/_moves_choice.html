{# One reminder per policy (decision 0117): the household chooses; nothing moves when a module is switched on. #}
<section class="card" id="moves-choice" aria-labelledby="moves-choice-title">
  <h2 id="moves-choice-title" style="margin-top:0">{{ box.title }}</h2>
  <p>{{ box.intro }}</p>
  {% if box.later_chosen == "later" %}<p class="muted">You chose to decide later. Nothing has moved.</p>{% endif %}
  <form method="post" action="/moves/{{ box.target }}/choice" class="actions" data-once>
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <button type="submit" name="choice" value="keep" id="moves-keep">{{ box.keep }}</button>
    <button type="submit" name="choice" value="review" class="quiet" id="moves-review">{{ box.review }}</button>
    <button type="submit" name="choice" value="later" class="quiet" id="moves-later">{{ box.later }}</button>
  </form>
</section>
