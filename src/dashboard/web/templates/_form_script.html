{# The form's styles and browser code: suggestions, linked lists, date previews. Shared by form.html and action_form.html. #}
<style>
  .suggest-box { position: relative; }
  .suggest-list { position: absolute; z-index: 5; left: 0; right: 0; margin: .2rem 0 0; padding: .25rem 0; list-style: none;
                  background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .suggest-list li { padding: .4rem .7rem; cursor: pointer; }
  .suggest-list li[aria-selected="true"], .suggest-list li:hover { background: var(--bg); }
  .suggest-list .muted { font-size: .9rem; }
  input.find { margin-bottom: .35rem; }
</style>
<script>
  // While typing a name: matches from this household's records first, then the module's list of common things.
  (function () {
    document.querySelectorAll("input[data-suggest]").forEach(function (input) {
      var list = document.createElement("ul"), items = [], active = -1, timer;
      list.className = "suggest-list"; list.hidden = true; list.setAttribute("role", "listbox");
      list.id = input.id + "-list";
      input.parentNode.appendChild(list);
      function close() { list.hidden = true; input.setAttribute("aria-expanded", "false"); active = -1;
                         input.removeAttribute("aria-activedescendant"); }
      function choose(item) {
        if (item.existing_id) { window.location = input.dataset.suggest.split("/suggest")[0] + "/" + item.existing_id; return; }
        input.value = item.name;
        Object.keys(item.fills || {}).forEach(function (name) {
          var field = document.getElementById("f-" + name), value = item.fills[name];
          if (!field) {  // yes/no asked as two choices
            var radio = document.getElementById("f-" + name + (value ? "-yes" : "-no"));
            if (radio) { radio.checked = true; }
            return;
          }
          if (field.type === "checkbox") field.checked = !!value;
          else if (field.tagName === "SELECT" || !field.value) field.value = value;
          field.dispatchEvent(new Event("change"));
        });
        close();
      }
      function show(found) {
        items = found; list.innerHTML = ""; active = -1;
        found.forEach(function (item, i) {
          var li = document.createElement("li");
          li.setAttribute("role", "option");
          li.id = input.id + "-opt-" + i;
          li.textContent = item.name;
          if (item.existing_id) { var note = document.createElement("span"); note.className = "muted"; note.textContent = " (you already have this: open it)"; li.appendChild(note); }
          li.addEventListener("mousedown", function (e) { e.preventDefault(); choose(item); });
          list.appendChild(li);
        });
        if (found.length) {
          var own = document.createElement("li"); own.className = "muted";
          own.setAttribute("role", "option"); own.id = input.id + "-opt-keep";
          own.textContent = "Keep \u201c" + input.value + "\u201d as you typed it";
          own.addEventListener("mousedown", function (e) { e.preventDefault(); close(); });
          list.appendChild(own);
        }
        if (!found.length && input.value.trim()) {
          var none = document.createElement("li"); none.className = "muted";
          none.textContent = "No match. Keep \u201c" + input.value.trim() + "\u201d as a new item, then choose its kind and unit.";
          list.appendChild(none);
        }
        list.hidden = !list.children.length;
        input.setAttribute("aria-expanded", list.hidden ? "false" : "true");
      }
      input.addEventListener("input", function () {
        clearTimeout(timer);
        if (!input.value.trim()) { close(); return; }
        timer = setTimeout(function () {
          fetch(input.dataset.suggest + "&q=" + encodeURIComponent(input.value), {credentials: "same-origin"})
            .then(function (r) { return r.ok ? r.json() : []; }).then(show).catch(function () {});
        }, 120);
      });
      input.addEventListener("keydown", function (e) {
        if (list.hidden) return;
        var options = list.querySelectorAll("li[role=option]");
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          active = (active + (e.key === "ArrowDown" ? 1 : -1) + options.length) % options.length;
          options.forEach(function (li, i) { li.setAttribute("aria-selected", i === active ? "true" : "false"); });
          input.setAttribute("aria-activedescendant", options[active].id);
        } else if (e.key === "Enter" && active >= 0) {
          e.preventDefault();
          if (active < items.length) choose(items[active]); else close();  // the last option keeps what was typed
        }
        else if (e.key === "Escape") { close(); }
      });
      input.addEventListener("blur", function () { setTimeout(close, 150); });
    });
  })();
  // Show the chosen record's private words (a medication detail) only when asked; changing the choice hides them
  // again. The words are fetched for that one record, never sent with the page (decision 0120).
  (function () {
    document.querySelectorAll("[data-reveal-link]").forEach(function (button) {
      var select = document.getElementById(button.dataset.for), out = document.getElementById(button.dataset.for + "-shown");
      if (!select || !out) return;
      select.addEventListener("change", function () { out.textContent = ""; out.hidden = true; });
      button.addEventListener("click", function () {
        if (!select.value) { out.textContent = "Choose one first."; out.hidden = false; return; }
        var data = new FormData(document.getElementById("reveal-form"));
        data.set("column", button.dataset.column);
        fetch(button.dataset.revealLink.replace("{id}", encodeURIComponent(select.value)),
              {method: "POST", body: data, credentials: "same-origin", headers: {"Accept": "application/json"}})
          .then(function (r) { return r.ok ? r.json() : null; }).then(function (found) {
            out.textContent = found ? found.text : "This could not be shown. Open the person's page to check it.";
            out.hidden = false;
          });
      });
    });
  })();
  // "Which batch" lists only the batches of the item chosen, and follows the item when it changes.
  // The server checks again when saving, so this is a convenience, not the safeguard.
  (function () {
    document.querySelectorAll("select[data-follows]").forEach(function (select) {
      var owner = document.getElementById("f-" + select.dataset.follows);
      var note = document.querySelector('[data-follows-note="' + select.id + '"]');
      if (!owner) return;
      var label = document.querySelector('label[for="' + owner.id + '"]');
      var word = label ? label.firstChild.textContent.trim().toLowerCase() : "one";
      function update(changed) {
        var shown = 0;
        if (changed === true && select.value && select.selectedOptions[0].dataset.owner !== owner.value) {
          select.value = "";  // a batch of the item chosen before is not carried over to another item
        }
        Array.prototype.forEach.call(select.options, function (option) {
          if (!option.value) return;
          // The batch already chosen stays in view, so nothing saved is ever dropped unseen.
          var match = option.dataset.owner === owner.value || option.selected;
          option.dataset.off = match ? "" : "1";
          option.hidden = option.disabled = !match;
          if (match) shown++;
        });
        var find = document.querySelector('input.find[data-find-for="' + select.id + '"]');
        if (find && changed === true) find.value = "";
        if (find) find.hidden = shown <= 8;
        if (note) {
          note.textContent = !owner.value ? "Choose the " + word + " first to see its " + note.dataset.things + "."
            : !shown ? "This " + word + " has no " + note.dataset.things + " yet." : "";
          note.hidden = !note.textContent;
        }
        if (changed === true) select.dispatchEvent(new Event("change"));
      }
      owner.addEventListener("change", function () { update(true); });
      update(false);
    });
  })();
  // The blank choice says what leaving it blank does, which depends on the reason chosen.
  (function () {
    document.querySelectorAll("option[data-blank-follows]").forEach(function (option) {
      var other = document.getElementById("f-" + option.dataset.blankFollows), words;
      try { words = JSON.parse(option.dataset.blankWords); } catch (e) { return; }
      if (!other) return;
      function update() { if (words[other.value]) option.textContent = words[other.value]; }
      other.addEventListener("change", update);
      update();
    });
  })();
  // Long lists of linked records (such as stock items) get a box to type into.
  (function () {
    document.querySelectorAll("input.find").forEach(function (find) {
      var select = document.getElementById(find.dataset.findFor), add = null;
      if (find.dataset.addNew) {
        add = document.createElement("a"); add.hidden = true; add.className = "help"; add.style.display = "block";
        find.parentNode.insertBefore(add, select.nextSibling);
      }
      find.addEventListener("input", function () {
        var typed = find.value.trim().toLowerCase(), first = null, shown = 0;
        Array.prototype.forEach.call(select.options, function (option) {
          var match = !option.value || (!option.dataset.off && option.text.toLowerCase().indexOf(typed) >= 0);
          option.hidden = !match;
          if (match && option.value) { shown++; if (!first) first = option; }
        });
        if (typed) { select.value = first ? first.value : ""; select.dispatchEvent(new Event("change")); }
        if (typed && !shown && find.dataset.search) {
          // Past the first records on the list: ask this computer's dashboard for matches.
          fetch(find.dataset.search + "&q=" + encodeURIComponent(find.value.trim()), {credentials: "same-origin"})
            .then(function (r) { return r.ok ? r.json() : []; })
            .then(function (found) {
              found.filter(function (item) { return item.existing_id; }).forEach(function (item) {
                var option = document.createElement("option");
                option.value = item.existing_id; option.textContent = item.name;
                select.appendChild(option);
                if (!select.value) { select.value = option.value; select.dispatchEvent(new Event("change")); }
              });
              if (add && select.value) add.hidden = true;
            }).catch(function () {});
        }
        if (add) {
          add.hidden = !typed || shown > 0;
          add.textContent = "Not on the list? Add \u201c" + find.value.trim() + "\u201d as a new one";
          add.href = find.dataset.addNew + encodeURIComponent(find.value.trim());
        }
      });
    });
  })();
  // Dates are typed the household's way (20/05/27); the date in words shows there is no mix-up.
  // The same rules as dashboard/core/dates.py; the server checks again when saving.
  (function () {
    var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September",
                  "October", "November", "December"];
    var EXAMPLES = {dmy: "Use DD/MM/YY, for example 20/05/27.", mdy: "Use MM/DD/YY, for example 05/20/27.",
                    ymd: "Use YYYY-MM-DD, for example 2027-05-20."};
    function real(y, mo, d) {
      var when = new Date(Date.UTC(y, mo - 1, d));
      return when.getUTCFullYear() === y && when.getUTCMonth() === mo - 1 && when.getUTCDate() === d;
    }
    function read(text, style) {
      var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(text), y, mo, d, typed = !m;
      if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
      else {
        m = /^(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{2}|\d{4})$/.exec(text);
        if (!m || style === "ymd") return null;
        d = style === "mdy" ? +m[2] : +m[1]; mo = style === "mdy" ? +m[1] : +m[2];
        y = +m[3] + (m[3].length === 2 ? 2000 : 0);
      }
      if (!real(y, mo, d)) return typed && real(y, d, mo) ? null : false;  // null: the other order
      return style === "mdy" ? MONTHS[mo - 1] + " " + d + ", " + y : d + " " + MONTHS[mo - 1] + " " + y;
    }
    document.querySelectorAll("[data-date-style]").forEach(function (input) {
      var preview = document.getElementById(input.id + "-preview");
      function update() {
        var text = input.value.trim(), words = text ? read(text, input.dataset.dateStyle) : null;
        preview.textContent = words ? "\u2192 " + words : !text ? "" : words === false ? "Not a real date" :
          EXAMPLES[input.dataset.dateStyle];  // typed some other way, such as another country's order
      }
      input.addEventListener("input", update);
      update();
    });
  })();
  // After a refused save, move to the list of answers to check.
  (function () { var summary = document.getElementById("error-summary"); if (summary) summary.focus(); })();
  // Fields that only apply to one choice (such as "Drinking water" for water) follow that choice.
  // Fields that only apply to a new batch ("Use by", "Where you put it") go away once a batch is chosen.
  (function () {
    document.querySelectorAll("[data-show-when], [data-only-when-blank]").forEach(function (box) {
      var choice = box.dataset.showWhen && document.getElementById("f-" + box.dataset.showWhen);
      var batch = box.dataset.onlyWhenBlank && document.getElementById("f-" + box.dataset.onlyWhenBlank);
      function update() {
        box.hidden = !!(choice && choice.value !== box.dataset.showValue) || !!(batch && batch.value);
      }
      if (choice) choice.addEventListener("change", update);
      if (batch) batch.addEventListener("change", update);
      update();
    });
  })();
  // Send once: a second click while the first is on its way does nothing (the server also refuses a repeat).
  document.querySelectorAll("form[data-once]").forEach(function (form) {
    form.addEventListener("submit", function (e) {
      if (form.dataset.sent) { e.preventDefault(); return; }
      form.dataset.sent = "1";
    });
  });
</script>
