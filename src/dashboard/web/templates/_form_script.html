{# The form's styles and browser code: suggestions, linked lists, date previews. Shared by form.html and action_form.html. #}
<style>
  .suggest-box { position: relative; }
  .suggest-list { position: absolute; z-index: 5; left: 0; right: 0; margin: .2rem 0 0; padding: .25rem 0; list-style: none;
                  background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .suggest-list li { padding: .4rem .7rem; cursor: pointer; }
  .suggest-list li[aria-selected="true"], .suggest-list li:hover { background: var(--bg); }
  .suggest-list .muted { font-size: .9rem; }
  input.find { margin-bottom: .35rem; }
</style>
<script src="/static/form-helpers.js" defer></script>
