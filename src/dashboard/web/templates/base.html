<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard Plus{% endblock %}</title>
  <style>
    :root { --bg: #f7f6f2; --fg: #1f2420; --muted: #5c645e; --accent: #2f6b4f; --card: #ffffff; --line: #dcdcd4;
            --bad: #a3361f; --bad-bg: #fbeee9; --good-bg: #e8f3ec; --wide: 64rem; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161a17; --fg: #e8ebe7; --muted: #a3aba5; --accent: #7cc4a0; --card: #1f2420; --line: #343a35;
              --bad: #f0a08a; --bad-bg: #3a221c; --good-bg: #1f3328; }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { border-bottom: 1px solid var(--line); background: var(--card); }
    header nav { max-width: var(--wide); margin: 0 auto; padding: .6rem 1rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    header a { color: var(--fg); text-decoration: none; }
    header .brand { font-weight: 700; margin-right: auto; }
    main { max-width: var(--wide); margin: 0 auto; padding: 1.5rem 1rem 2rem; }
    h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
    h2 { font-size: 1.2rem; margin: 1.5rem 0 .5rem; }
    a { color: var(--accent); }
    .lead { color: var(--muted); margin-top: 0; }
    .muted { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem; margin: 1.25rem 0; }
    .notice { background: var(--good-bg); border-radius: 8px; padding: .6rem .9rem; margin: 1rem 0; }
    .problem { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: .6rem .9rem; margin: 1rem 0; }
    button, .button { background: var(--accent); color: var(--bg); border: 0; border-radius: 8px; padding: .6rem 1rem; font: inherit; cursor: pointer; text-decoration: none; display: inline-block; }
    .button.quiet, button.quiet { background: transparent; color: var(--accent); border: 1px solid var(--line); }
    button.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); }
    .actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin: 1rem 0; }
    table.grid { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .grid th, .grid td { text-align: left; padding: .5rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    .grid th a { color: var(--fg); text-decoration: none; }
    .grid tbody tr:hover { background: var(--bg); }
    .scroll { overflow-x: auto; }
    form.record { display: grid; gap: 1rem; max-width: 36rem; }
    form.record label { font-weight: 600; display: block; margin-bottom: .25rem; }
    form.record .help { color: var(--muted); font-size: .9rem; margin: .2rem 0 0; }
    form.record .error { color: var(--bad); font-size: .95rem; margin: .2rem 0 0; }
    input[type=text], input[type=number], input[type=date], input[type=datetime-local], select, textarea {
      width: 100%; font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .5rem .6rem; }
    .has-error input, .has-error select, .has-error textarea { border-color: var(--bad); }
    textarea { min-height: 6rem; }
    .choices { display: grid; gap: .25rem; }
    .required { color: var(--bad); }
    details.secret summary { cursor: pointer; color: var(--muted); }
    .history li { margin-bottom: .4rem; }
    .tables { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
    .tables .card { margin: 0; }
    footer { color: var(--muted); font-size: .85rem; max-width: var(--wide); margin: 0 auto; padding: 0 1rem 2rem; }
  </style>
</head>
<body>
  <header><nav>
    <a class="brand" href="/">Dashboard Plus</a>
    <a href="/close">Close safely</a>
  </nav></header>
  <main>
    {% block body %}{% endblock %}
  </main>
  <footer>Runs on this computer only. Nothing is sent anywhere. Version {{ version }}.</footer>
</body>
</html>
