<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard Plus{% endblock %}</title>
  <style>
    :root { --bg: #f7f6f2; --fg: #1f2420; --muted: #5c645e; --accent: #2f6b4f; --card: #ffffff; --line: #dcdcd4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161a17; --fg: #e8ebe7; --muted: #a3aba5; --accent: #7cc4a0; --card: #1f2420; --line: #343a35; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 42rem; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
    .lead { color: var(--muted); margin-top: 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem; margin: 1.25rem 0; }
    button, .button { background: var(--accent); color: var(--bg); border: 0; border-radius: 8px; padding: .7rem 1.1rem; font: inherit; cursor: pointer; text-decoration: none; display: inline-block; }
    footer { color: var(--muted); font-size: .85rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <main>
    {% block body %}{% endblock %}
    <footer>Runs on this computer only. Nothing is sent anywhere.</footer>
  </main>
</body>
</html>
