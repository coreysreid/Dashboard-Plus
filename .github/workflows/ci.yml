name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Privacy check (nothing personal may be committed)
        run: python tools/check_privacy.py
      - name: Index check (every folder has a current INDEX.md)
        run: python tools/check_indexes.py
      - name: Project map is up to date
        run: python tools/make_project_map.py --check
      - name: Install the pinned libraries (checksums verified)
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  portable:
    name: Portable Windows build
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the portable folder
        run: python tools/build_portable.py --out dist
      - name: Start it, check it answers, close it safely
        run: python tools/smoke_test_portable.py "dist/Dashboard Plus"
      - name: Keep the zip for testing
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-plus-windows
          path: dist/*.zip
          retention-days: 14
