name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Privacy check (nothing personal may be committed)
        run: python tools/check_privacy.py
      - name: Index check (every folder has a current INDEX.md)
        run: python tools/check_indexes.py
      - name: Project map is up to date
        run: python tools/make_project_map.py --check
      - name: Install the pinned libraries (checksums verified)
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  browser:
    # Clicks through the real program in Chromium (decision 0064). Linux only: Windows runs the same
    # test file, which skips itself because Playwright is not installed there.
    name: Real-browser check (Linux, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the pinned libraries (checksums verified)
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install Playwright (exact version) and its Chromium
        run: |
          npm install --no-save --no-package-lock playwright@=1.63.0  # "=": exactly this version
          npx playwright install --with-deps chromium
      - name: Click through setup, dates, stock in, private details and closing
        env:
          PYTHONPATH: src
        run: python tools/browser_check.py

  portable:
    name: Portable Windows build
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the portable folder
        run: python tools/build_portable.py --out dist
      - name: Start it, check it answers, close it safely
        run: python tools/smoke_test_portable.py "dist/Dashboard Plus"
      - name: Keep the zip for testing
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-plus-windows
          path: dist/*.zip
          retention-days: 14

  macos:
    # The unsigned Mac app preview (decision 0096). It is not signed or notarised; no secrets are used.
    # macos-latest runs on Apple silicon, so this builds the arm64 app; an Intel build needs an Intel runner.
    name: Mac app (unsigned preview, Apple silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned libraries (checksums verified)
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Every check, on a Mac
        run: python tools/check_all.py
      - name: Build the unsigned Mac app and zip
        run: python tools/build_macos.py --out dist
      - name: Start it through its launcher, check it answers, close it safely
        run: python tools/smoke_test_portable.py "dist/Dashboard Plus/Dashboard Plus.app"
      - name: Keep the zip for testing
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-plus-macos-arm64-unsigned
          path: dist/*.zip
          retention-days: 14
